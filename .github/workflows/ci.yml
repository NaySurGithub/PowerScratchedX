name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run gen
      - run: npm run gen -- scripts/fixtures/custom-content.psx.json
      - run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/powerscratchedx-backend.jar
